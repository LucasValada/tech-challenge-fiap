apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: oficina
data:
  NODE_ENV: "production"
  APPLICATION_PORT: "3000"
  JWT_EXPIRES_IN: "1h"
  # Valor retornado pelo output mail_url do Terraform da stack tc3-auth-lambda.
  MAIL_LAMBDA_URL: "https://EXEMPLO.execute-api.us-east-1.amazonaws.com/mail"
