# Job one-shot que aplica as migrations do Prisma antes do Deployment principal.
# O CD substitui IMAGE_PLACEHOLDER pela imagem do ECR e aplica:
#   sed "s|IMAGE_PLACEHOLDER|<ecr>/tc3-oficina-<env>-api:<sha>|g" 03-migration-job.yaml | kubectl apply -f -
#
# Roda de dentro do cluster porque o RDS fica em subnet privada (inalcançável de
# fora da VPC). Sem initContainer: o RDS gerenciado já está no ar.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: oficina
  labels:
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        # A saída do `prisma migrate` é texto puro, não JSON: no New Relic
        # viraria linhas sem atributo algum, na mesma cota do free tier. O CD
        # já imprime este log no próprio pipeline (`kubectl logs job/...`),
        # que é onde alguém procura quando a migration falha.
        fluentbit.io/exclude: "true"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: IMAGE_PLACEHOLDER
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DATABASE_URL
