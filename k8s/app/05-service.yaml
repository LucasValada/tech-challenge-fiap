# Service ClusterIP da API. Com o ALB usando target-type: ip, o balanceador
# registra os IPs dos pods diretamente; o Service serve de seletor/DNS interno
# (e é o alvo do port-forward no smoke test do CD).
apiVersion: v1
kind: Service
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app: oficina-api
spec:
  type: ClusterIP
  selector:
    app: oficina-api
  ports:
    - port: 3000
      targetPort: 3000
