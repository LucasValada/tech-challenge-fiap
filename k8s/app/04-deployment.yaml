# Deployment da API no EKS. O CD substitui IMAGE_PLACEHOLDER pela imagem do ECR:
#   sed "s|IMAGE_PLACEHOLDER|<ecr>/tc3-oficina-<env>-api:<sha>|g" 04-deployment.yaml | kubectl apply -f -
#
# Sem initContainer de espera: o banco é o RDS gerenciado (fora do cluster), que
# já está no ar antes de qualquer pod — não há serviço no cluster para aguardar.
# As probes usam os endpoints de saúde dedicados (liveness raso, readiness com DB).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app: oficina-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      # Hardening: roda sem privilégios (a imagem já usa o usuário node, UID 1000)
      # e sem montar o token da ServiceAccount (o app não fala com a API do k8s).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      # Alta disponibilidade: espalha as réplicas entre AZs e nós. Soft
      # (ScheduleAnyway) para não deixar pods Pending quando faltar capacidade.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: oficina-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: oficina-api
      containers:
        - name: oficina-api
          image: IMAGE_PLACEHOLDER
          # Sem escalonamento de privilégio e sem capabilities do Linux — a API
          # é um servidor HTTP na porta 3000, não precisa de nenhuma.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: JWT_SECRET
            - name: MAIL_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MAIL_USER
            - name: MAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MAIL_PASS
            - name: WEBHOOK_ORCAMENTO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: WEBHOOK_ORCAMENTO_TOKEN
          # Requests/limits são obrigatórios para o HPA calcular a utilização.
          # O request de memória é o denominador dessa conta: com 128Mi, a API
          # ociosa já batia nos 80% do alvo e o autoscaler subia para 4 réplicas
          # sem carga alguma.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
