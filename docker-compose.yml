services:
  postgres:
    image: postgres:17
    container_name: oficina-postgres
    restart: always
    environment:
      POSTGRES_USER: ${OFICINA_USER}
      POSTGRES_PASSWORD: ${OFICINA_PASSWORD}
      POSTGRES_DB: ${OFICINA_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OFICINA_USER} -d ${OFICINA_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Aplica as migrations uma vez e sai — o mesmo papel do Job `db-migration` no
  # Kubernetes. Saíram do CMD da imagem para o stdout da API ser só JSON e para
  # réplicas não concorrerem pela mesma migration.
  migrate:
    container_name: oficina-migrate
    build:
      context: ./
      dockerfile: ./Dockerfile
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${OFICINA_USER}:${OFICINA_PASSWORD}@postgres:5432/${OFICINA_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    container_name: oficina-api
    restart: on-failure
    build:
      context: ./
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV}
      APPLICATION_PORT: 3000
      DATABASE_URL: postgresql://${OFICINA_USER}:${OFICINA_PASSWORD}@postgres:5432/${OFICINA_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_PORT: ${MAIL_PORT}
      WEBHOOK_ORCAMENTO_TOKEN: ${WEBHOOK_ORCAMENTO_TOKEN}

      # ─── New Relic ──────────────────────────────────────────────────────
      # Todos os valores vêm do .env (ignorado pelo git) — nada de credencial
      # neste arquivo. Sem .env, o agente fica desligado e a chave vazia.
      NEW_RELIC_ENABLED: ${NEW_RELIC_ENABLED:-false}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-oficina-api}
      NEW_RELIC_LABELS: ${NEW_RELIC_LABELS:-environment:production;project:tech-challenge-fiap}
      NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
      NEW_RELIC_DISTRIBUTED_TRACING_EXCLUDE_NEWRELIC_HEADER: "true"
    ports:
      - ${APPLICATION_PORT}:3000
    healthcheck:
      # Readiness de verdade (checa o banco), e não a página do Swagger.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
