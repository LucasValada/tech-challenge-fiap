name: CI

# Nos PRs, este workflow é o check `Build & Test`. No push em develop/main quem
# o roda é o CD (cd.yml), como primeiro estágio antes da imagem e do deploy:
# cada commit é testado uma vez só.
on:
  pull_request:
    branches: [main, develop]
  workflow_call:

# Chamado pelo CD, `github.workflow` seria o nome do CD; o grupo usa um nome
# fixo para não colidir com os grupos do workflow que o chama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint:check

      # Falha se a cobertura de linhas ou de instruções ficar abaixo de 80%
      # (coverageThreshold no package.json).
      - name: Unit tests with coverage
        run: npm run test:cov

      - name: Compile TypeScript
        run: npm run build

  # BDD do fluxo completo (test/bdd/) com os três serviços de verdade, como o
  # professor orientou: OS construído deste commit, Billing e Execution
  # construídos dos repositórios deles na mesma branch de destino (develop ou
  # main), dois PostgreSQL, LocalStack (SQS e DynamoDB) e o simulador do
  # Mercado Pago (compose de test/integracao/). Os três repositórios ficam lado
  # a lado, como na máquina de quem desenvolve: dentro da pasta do OS, os outros
  # dois entrariam no contexto do build da imagem dele.
  bdd:
    name: BDD (três serviços)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: os
    env:
      COMPOSE: docker compose -p oficina-bdd -f test/integracao/docker-compose.yml
      BILLING_DIR: ${{ github.workspace }}/oficina-billing-service
      EXECUTION_DIR: ${{ github.workspace }}/oficina-execution-service
      # O JWT_SECRET dos serviços no compose (segredo de teste, só existe ali).
      BDD_JWT_SECRET: segredo-de-integracao

    steps:
      # Nenhum passo deste job faz push: a credencial do GitHub não fica no
      # .git dos checkouts.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: os
          persist-credentials: false

      - name: Checkout Billing Service
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: fiap-soat-oficina-tech-challenge/oficina-billing-service
          ref: ${{ github.base_ref || github.ref_name }}
          path: oficina-billing-service
          persist-credentials: false

      - name: Checkout Execution Service
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: fiap-soat-oficina-tech-challenge/oficina-execution-service
          ref: ${{ github.base_ref || github.ref_name }}
          path: oficina-execution-service
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: os/package-lock.json

      # Sem scripts de instalação: o BDD só usa o Cucumber e o ts-node, que não
      # dependem deles, e nenhum pacote roda código na instalação.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Subir os três serviços
        run: $COMPOSE up -d --build --wait

      - name: BDD
        run: npm run test:bdd

      - name: Logs dos serviços
        if: failure()
        run: $COMPOSE logs --no-color --tail=200 os billing execution

      - name: Relatório do BDD
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-bdd
          path: os/test/bdd/relatorio/
          if-no-files-found: ignore

      - name: Derrubar os serviços
        if: always()
        run: $COMPOSE down -v
