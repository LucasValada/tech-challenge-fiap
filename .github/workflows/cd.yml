name: CD

# Um único ambiente na AWS: as duas branches (develop e main) deployam no mesmo
# cluster/RDS/ECR/SSM de homolog.
on:
  push:
    branches: [main, develop]

# OIDC: assume a role da AWS sem chave estática (contents:read p/ checkout).
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: homolog
  EKS_CLUSTER: tc3-oficina-homolog
  ECR_REPOSITORY: tc3-oficina-homolog-api
  SSM_PREFIX: /tc3-oficina/homolog
  NAMESPACE: oficina

jobs:
  # ─── Stage 1: Test guard ──────────────────────────────────────────────────
  # Repete a validação do CI antes de empacotar/deployar: um push com testes
  # quebrados nunca produz imagem publicada nem deploy.
  test:
    name: Build & Test (guard)
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run unit tests
        run: npm test -- --passWithNoTests
      - name: Compile TypeScript
        run: npm run build

  # ─── Stage 2: Build & push da imagem no ECR ───────────────────────────────
  build:
    name: Build & Push (ECR)
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.meta.outputs.image_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image references
        id: meta
        run: |
          REG="${{ steps.ecr.outputs.registry }}"
          echo "image_sha=${REG}/${ECR_REPOSITORY}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image_branch=${REG}/${ECR_REPOSITORY}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Runner é amd64 → build nativo linux/amd64 (os nós do EKS são x86).
      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image_sha }}
            ${{ steps.meta.outputs.image_branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Stage 3: Deploy no EKS ───────────────────────────────────────────────
  deploy:
    name: Deploy (EKS)
    runs-on: ubuntu-latest
    needs: build
    environment: homolog
    # Serializa deploys: as duas branches miram o MESMO cluster, então nunca
    # dois deploys ao mesmo tempo (sem cancelar um deploy em andamento).
    concurrency:
      group: deploy-homolog
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Namespace
        run: kubectl apply -f k8s/00-namespace.yaml

      # Monta o Secret a partir do SSM (mesmo JWT_SECRET que a Lambda usa). Os
      # valores são mascarados nos logs; o YAML gerado vai pelo pipe, não é
      # impresso. DATABASE_URL recebe sslmode=require (o app abre TLS no RDS).
      - name: Sync app-secret from SSM
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          WEBHOOK_ORCAMENTO_TOKEN: ${{ secrets.WEBHOOK_ORCAMENTO_TOKEN }}
        run: |
          set -euo pipefail
          DB_URL=$(aws ssm get-parameter --name "${SSM_PREFIX}/DATABASE_URL" --with-decryption --query Parameter.Value --output text)
          JWT=$(aws ssm get-parameter --name "${SSM_PREFIX}/JWT_SECRET" --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$DB_URL"
          echo "::add-mask::$JWT"
          case "$DB_URL" in *sslmode=*) : ;; *) DB_URL="${DB_URL}&sslmode=require";; esac
          kubectl create secret generic app-secret -n "$NAMESPACE" \
            --from-literal=DATABASE_URL="$DB_URL" \
            --from-literal=JWT_SECRET="$JWT" \
            --from-literal=MAIL_USER="${MAIL_USER:-placeholder}" \
            --from-literal=MAIL_PASS="${MAIL_PASS:-placeholder}" \
            --from-literal=WEBHOOK_ORCAMENTO_TOKEN="${WEBHOOK_ORCAMENTO_TOKEN:-placeholder}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: ConfigMap
        run: kubectl apply -f k8s/app/01-configmap.yaml

      - name: Run database migrations (Job)
        run: |
          set -euo pipefail
          kubectl delete job db-migration -n "$NAMESPACE" --ignore-not-found
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|g" k8s/app/03-migration-job.yaml | kubectl apply -f -
          if ! kubectl wait --for=condition=complete job/db-migration -n "$NAMESPACE" --timeout=180s; then
            echo "::error::Migration não completou"
            kubectl logs -n "$NAMESPACE" job/db-migration --tail=120 || true
            exit 1
          fi
          kubectl logs -n "$NAMESPACE" job/db-migration --tail=40 || true

      - name: Deploy application
        run: |
          set -euo pipefail
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|g" k8s/app/04-deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/app/05-service.yaml
          kubectl apply -f k8s/app/06-hpa.yaml
          kubectl apply -f k8s/app/07-ingress.yaml
          kubectl rollout status deployment/oficina-api -n "$NAMESPACE" --timeout=180s

      - name: Diagnose on failure
        if: failure()
        run: |
          kubectl get all -n "$NAMESPACE" -o wide || true
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp | tail -40 || true
          kubectl describe pods -n "$NAMESPACE" || true
          for pod in $(kubectl get pods -n "$NAMESPACE" -l app=oficina-api -o name); do
            echo "--- logs $pod ---"; kubectl logs "$pod" -n "$NAMESPACE" --tail=200 --all-containers=true || true
            echo "--- previous $pod ---"; kubectl logs "$pod" -n "$NAMESPACE" --tail=200 --all-containers=true --previous || true
          done

      - name: Smoke test
        run: |
          set -euo pipefail
          kubectl port-forward -n "$NAMESPACE" svc/oficina-api 3000:3000 >/tmp/pf.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          API=http://localhost:3000

          echo "=== 1. Aguarda /health ==="
          for i in $(seq 1 30); do
            curl -sf "$API/health" >/dev/null && { echo "pronto após ${i}s"; break; }
            [ "$i" = 30 ] && { echo "app não respondeu em 30s"; exit 1; }
            sleep 1
          done
          curl -sf "$API/health/ready" | jq -e '.status == "ok" and .database == "up"' >/dev/null
          echo "readiness (DB) OK"

          echo "=== 2. Login admin ==="
          TOKEN=$(curl -sf -X POST "$API/auth/login" -H "Content-Type: application/json" \
            -d '{"email":"admin@oficina.com","senha":"senha123"}' | jq -er '.accessToken')
          AUTH="Authorization: Bearer $TOKEN"; echo "token OK (${#TOKEN} chars)"

          echo "=== 3. Cria cliente (CPF formatado — valida normalização) ==="
          CLIENTE_ID=$(curl -sf -X POST "$API/cliente" -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"nome":"Smoke Test","tipoPessoa":"FISICA","cpfCnpj":"529.982.247-25"}' | jq -er '.id')
          STORED=$(curl -sf "$API/cliente/$CLIENTE_ID" -H "$AUTH" | jq -er '.cpfCnpj')
          [ "$STORED" = "52998224725" ] || { echo "CPF deveria ser normalizado p/ dígitos, veio $STORED"; exit 1; }
          echo "cliente $CLIENTE_ID (cpf normalizado)"

          echo "=== 4. Veículo, serviço, item ==="
          curl -sf -X POST "$API/veiculos" -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"clienteId\":\"$CLIENTE_ID\",\"placa\":\"ABC1D23\",\"marca\":\"Honda\",\"modelo\":\"Civic\",\"ano\":2020}" | jq -e '.id > ""' >/dev/null
          SERVICO_ID=$(curl -sf -X POST "$API/servicos" -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"nome":"Troca de oleo","precoBase":150.00,"tempoEstimadoMin":30}' | jq -er '.id')
          ITEM_ID=$(curl -sf -X POST "$API/itens-estoque" -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"nome":"Oleo 5W30","tipo":"INSUMO","sku":"SMOKE-OLE","precoUnitario":45.00,"quantidadeEstoque":50,"estoqueMinimo":10}' | jq -er '.id')

          echo "=== 5. Abre OS + valida baixa de estoque (50-4=46) ==="
          OS_JSON=$(curl -sf -X POST "$API/ordens-servico" -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"cpfCnpj\":\"52998224725\",\"placa\":\"ABC1D23\",\"servicos\":[{\"servicoId\":\"$SERVICO_ID\",\"quantidade\":1}],\"itens\":[{\"itemEstoqueId\":\"$ITEM_ID\",\"quantidade\":4}]}")
          OS_ID=$(echo "$OS_JSON" | jq -er '.id'); OS_CODIGO=$(echo "$OS_JSON" | jq -er '.codigo')
          QTD=$(curl -sf "$API/itens-estoque/$ITEM_ID" -H "$AUTH" | jq -er '.quantidadeEstoque')
          [ "$QTD" = "46" ] || { echo "estoque esperado 46, veio $QTD"; exit 1; }
          echo "OS $OS_CODIGO, estoque 46 (baixa atômica OK)"

          echo "=== 6. Consulta pública + auth negada (401) ==="
          curl -sf "$API/public/ordens-servico/$OS_CODIGO?placa=ABC1D23" | jq -e '.status == "RECEBIDA"' >/dev/null
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$API/cliente"); [ "$CODE" = "401" ] || { echo "esperado 401, veio $CODE"; exit 1; }
          echo "público OK / 401 OK"

          echo "=== 7. HPA e réplicas ==="
          kubectl get hpa oficina-api-hpa -n "$NAMESPACE" >/dev/null
          AVAIL=$(kubectl get deployment/oficina-api -n "$NAMESPACE" -o jsonpath='{.status.availableReplicas}')
          [ "$AVAIL" = "2" ] || { echo "esperado 2 réplicas, veio $AVAIL"; exit 1; }
          echo "HPA OK, 2 réplicas servindo"

          echo "=== Smoke test OK ==="
